services:
  postgres:
    image: postgres:16-alpine
    container_name: webin10_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webin10_admin
      POSTGRES_PASSWORD: webin10_secret
      POSTGRES_DB: webin10_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webin10_admin -d webin10_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webin10_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
